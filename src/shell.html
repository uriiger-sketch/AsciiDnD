<title>Sundown ASCII Engine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* layout: one canvas, the whole screen, drawn as a grid of ASCII characters. Nothing else. */
  :root { color-scheme: dark; --bg: #000; --fg: #f2ecd8; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #wrap { position: fixed; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
    left: max(0px, env(safe-area-inset-left, 0px)); right: max(0px, env(safe-area-inset-right, 0px)); }
  #screen { width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
  #screen:focus { outline: none; }
</style>
<div id="wrap"><canvas id="screen" tabindex="0" aria-label="Sundown: a western drawn in ASCII characters"></canvas></div>
